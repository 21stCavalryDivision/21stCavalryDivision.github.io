name: Sync Media Gallery

on:
  push:
    paths:
      - "assets/screenshots/**"
      - ".github/scripts/generate-media-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate media manifest
        run: node .github/scripts/generate-media-manifest.mjs

      - name: Commit updated media manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots.json

          if git diff --cached --quiet; then
            echo "Media gallery is already up to date."
            exit 0
          fi

          git commit -m "Auto-update media gallery"
          git push
